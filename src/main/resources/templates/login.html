<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NexusDine · Staff Login</title><link rel="stylesheet" th:href="@{/css/style.css}"><style>body{min-height:100vh;display:grid;place-items:center;background:#080e18;color:#eef5ff}.login-card{width:min(92vw,420px);padding:32px;border:1px solid #233248;border-radius:22px;background:#101927;box-shadow:0 24px 70px #0005}.login-card h1{margin:18px 0 8px}.login-card p{color:#9bb0ca}.login-card label{display:block;margin:18px 0 7px}.login-card input{width:100%;padding:13px;border:1px solid #293b52;border-radius:10px;background:#0a1220;color:white}.login-card button{width:100%;margin-top:22px}.login-error{color:#ff9292!important}.login-note{font-size:12px;margin-top:18px}</style></head><body><main class="login-card"><a class="brand" href="/"><span class="brand-mark">✦</span><span>Nexus<span class="accent">Dine</span><small>STAFF ACCESS</small></span></a><h1>Welcome back</h1><p>Sign in to your role-specific workspace.</p><p class="login-error" th:if="${param.error}">Username or password is incorrect.</p><p th:if="${param.logout}">You have been logged out.</p><form method="post" th:action="@{/login}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required autofocus><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button class="btn btn-primary btn-block" type="submit">Sign in securely</button></form><p class="login-note">Customer ordering does not require staff login. Admin and Cook access is restricted by role.</p></main></body></html>
